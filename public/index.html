<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirect Chain Analyzer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary shadow-sm">
    <div class="container">
      <span class="navbar-brand mb-0 h1">🔗 Redirect Chain Analyzer</span>
      <span class="badge bg-light text-primary">Security-Focused</span>
    </div>
  </nav>

  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-lg-10">
        <div class="card shadow-sm mb-4">
          <div class="card-body">
            <h5 class="card-title mb-3">Analyze URL Redirect Chain</h5>
            <form id="analyzeForm" class="row g-2">
              <div class="col-md-9">
                <input type="url" class="form-control form-control-lg" id="urlInput" placeholder="https://example.com or bit.ly/short" required>
              </div>
              <div class="col-md-3">
                <button type="submit" class="btn btn-primary btn-lg w-100" id="analyzeBtn">Analyze</button>
              </div>
            </form>
            <div id="loading" class="text-center mt-3 d-none">
              <div class="spinner-border text-primary" role="status"></div>
              <p class="mt-2 text-muted">Resolving chain securely…</p>
            </div>
            <div id="errorAlert" class="alert alert-danger mt-3 d-none"></div>
          </div>
        </div>

        <div id="results" class="d-none">
          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <div class="card h-100">
                <div class="card-body">
                  <h6 class="text-muted">Original URL</h6>
                  <p id="originalUrl" class="mb-0 text-break fw-medium"></p>
                </div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="card h-100 border-success">
                <div class="card-body">
                  <h6 class="text-muted">Final Destination</h6>
                  <p id="finalUrl" class="mb-0 text-break fw-medium text-success"></p>
                </div>
              </div>
            </div>
          </div>

          <div class="card mb-4">
            <div class="card-header d-flex justify-content-between align-items-center">
              <span>Redirect Chain</span>
              <div>
                <button class="btn btn-sm btn-outline-secondary me-1" id="exportJson">Export JSON</button>
                <button class="btn btn-sm btn-outline-secondary" id="exportCsv">Export CSV</button>
              </div>
            </div>
            <div class="card-body">
              <div id="chainContainer"></div>
              <canvas id="chainChart" height="80" class="mt-3"></canvas>
            </div>
          </div>

          <div id="warnings" class="alert alert-warning d-none"></div>
        </div>

        <div class="card">
          <div class="card-header">Scan History</div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover mb-0">
                <thead class="table-light">
                  <tr>
                    <th>ID</th>
                    <th>Original URL</th>
                    <th>Hops</th>
                    <th>Loop</th>
                    <th>Date</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="historyBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
